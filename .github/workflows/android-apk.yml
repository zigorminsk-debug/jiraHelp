name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/f70f3591-jirahelp
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - 'kerio-letsencrypt-win/version.go'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # На раннерах GitHub Actions Android SDK уже установлен
      # (/usr/local/lib/android/sdk). Отдельный action не нужен и только
      # добавляет точку отказа — проверяем и доустанавливаем недостающее сами.
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          test -d "$SDK" || { echo "Нет Android SDK в $SDK"; exit 1; }
          echo "Содержимое SDK:"; ls "$SDK"
          SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          echo "sdkmanager: ${SDKMANAGER:-не найден}"
          if [[ -n "$SDKMANAGER" ]]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            [[ -d "$SDK/platforms/android-34" ]] || "$SDKMANAGER" "platforms;android-34"
            [[ -x "$SDK/build-tools/35.0.0/aapt" ]] || "$SDKMANAGER" "build-tools;35.0.0"
          fi
          test -f "$SDK/platforms/android-34/android.jar" || { echo "Нет platforms/android-34"; exit 1; }
          test -x "$SDK/build-tools/35.0.0/aapt" || { echo "Нет build-tools 35.0.0"; exit 1; }
          echo "SDK готов"

      - name: Build signed APK
        env:
          ANDROID_PLATFORM: android-34
          ANDROID_BUILD_TOOLS: 35.0.0
          KCM_KEYSTORE_BASE64: ${{ secrets.KCM_KEYSTORE_BASE64 }}
          KCM_KEYSTORE_PASS: ${{ secrets.KCM_KEYSTORE_PASS }}
          KCM_KEY_ALIAS: ${{ secrets.KCM_KEY_ALIAS }}
        run: bash android/build-apk.sh

      - name: Sanity check APK
        run: |
          set -euo pipefail
          APK=$(ls build/android/KerioCertManager-Mobile-*.apk)
          echo "APK: $APK"
          ls -l "$APK"

          # Пакет и версия должны совпадать с манифестом — иначе получим
          # «обновление не устанавливается» на телефоне.
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E '^package:|^application-label:'
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" \
            | grep -E "versionCode='[0-9]+'" || true

          VERIFIED=$("$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")
          echo "$VERIFIED" | grep -i 'verified'
          echo "$VERIFIED" | grep -qi 'Verified using v2 scheme.*true' \
            || echo "::warning::APK без подписи v2 — старые Android могут не принять обновление"

          # Постоянная подпись: сравниваем отпечаток с keystore.properties.
          # Если ключ подменили, релиз не должен уехать.
          EXPECTED=$(sed -n 's/^sha256=//p' android/keystore/keystore.properties | tr -d ':' | tr 'A-Z' 'a-z')
          ACTUAL=$(echo "$VERIFIED" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          echo "Отпечаток подписи: ${ACTUAL:-не определён}"
          if [[ -n "$EXPECTED" && "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::APK подписан не постоянным ключом ($ACTUAL вместо $EXPECTED)"
            exit 1
          fi
          echo "Обновления будут устанавливаться поверх — подпись постоянная."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KerioCertManager-Mobile
          path: |
            build/android/KerioCertManager-Mobile-*.apk
            build/android/KerioCertManager-Mobile-*.sha256
            build/android/signature.txt
          if-no-files-found: error

      - name: Attach APK to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          APK=$(ls build/android/KerioCertManager-Mobile-*.apk)
          SHA=$(ls build/android/KerioCertManager-Mobile-*.sha256)
          # Релиз к тегу создаёт сборка Windows; здесь только догружаем APK.
          # Если сборка Windows ещё не дошла до создания релиза — создаём сами.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "KerioCertManager $TAG" \
              --notes "Автоматическая сборка $TAG" --verify-tag
          fi
          gh release upload "$TAG" "$APK" "$SHA" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
